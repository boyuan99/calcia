[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calcia"
version = "0.0.1"
description = "Python implementation of neural volume simulation"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Bo Yuan"}
]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "trimesh>=3.9.0",
    "scikit-image>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0.0",
    "pytest-cov>=2.0.0",
    "matplotlib>=3.4.0",
    "pyinstrument>=4.0.0",
]
all = [
    "matplotlib>=3.4.0",
    "numba>=0.53.0",
]

[project.urls]
Homepage = "https://github.com/boyuan/calcia"
Repository = "https://github.com/boyuan/calcia"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["calcia"]
omit = ["tests/*", "examples/*"]
