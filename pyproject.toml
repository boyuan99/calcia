[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calcia"
version = "0.0.1"
description = "Python implementation of neural volume simulation"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Bo Yuan"}
]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "trimesh>=3.9.0",
    "scikit-image>=0.19.0",
    # Accelerated ray backend for trimesh point-in-mesh tests (Phase 1, ~52%
    # of runtime). trimesh auto-uses it; without it, the slower pure-Python
    # ray_triangle backend runs instead and yields a slightly different volume
    # realization, so we pin it for consistent + fast results across machines.
    "embreex>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0.0",
    "pytest-cov>=2.0.0",
    "matplotlib>=3.4.0",
    "pyinstrument>=4.0.0",
]
all = [
    "matplotlib>=3.4.0",
    "numba>=0.53.0",
]
# Interactive visualizer (calcia.viz). Desktop (PyQt5 + pyvistaqt) and browser
# (trame) front-ends over a shared PyVista scene. Kept optional so `import
# calcia` never requires a GPU/Qt stack.
viz = [
    "pyvista>=0.44",
    "pyvistaqt>=0.11",
    "pyqtgraph>=0.13",
    "qtpy>=2.4",
    "PyQt5>=5.15",
    "matplotlib>=3.4.0",
    "trame>=3.0",
    "trame-vtk",
    "trame-vuetify",
]

[project.scripts]
calcia-viz = "calcia.viz.app_qt:main"
calcia-viz-web = "calcia.viz.app_trame:main"
calcia-viz-check = "calcia.viz.render_check:main"

[project.urls]
Homepage = "https://github.com/boyuan/calcia"
Repository = "https://github.com/boyuan/calcia"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["calcia"]
omit = ["tests/*", "examples/*"]
