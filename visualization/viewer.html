<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcia - Neuron 3D Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            overflow: hidden;
        }
        #container {
            width: 100vw;
            height: 100vh;
        }
        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            min-width: 250px;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: #4ecdc4;
        }
        .control-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: #aaa;
        }
        select, button, input[type="file"] {
            width: 100%;
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            background: #2d2d44;
            color: #fff;
            font-size: 0.9rem;
            cursor: pointer;
        }
        select:hover, button:hover {
            background: #3d3d54;
        }
        button {
            background: #4ecdc4;
            color: #1a1a2e;
            font-weight: bold;
            margin-top: 5px;
        }
        button:hover {
            background: #45b7aa;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .checkbox-group input {
            width: auto;
        }
        input[type="range"] {
            width: 100%;
            margin-top: 5px;
        }
        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            font-size: 0.85rem;
            color: #aaa;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
            color: #4ecdc4;
        }
        .hidden {
            display: none !important;
        }
        #tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            pointer-events: none;
            z-index: 1000;
            display: none;
            border: 1px solid #4ecdc4;
            max-width: 250px;
        }
        #tooltip .type-name {
            color: #4ecdc4;
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }
        #tooltip .type-info {
            color: #aaa;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div id="container"></div>

    <div id="controls">
        <h1>Calcia Viewer</h1>

        <div class="control-group">
            <label>Load Data</label>
            <select id="dataSelect">
                <optgroup label="Python">
                    <option value="neuron_data.json">Single Neuron (Python)</option>
                    <option value="neurons_data.json">Multiple Neurons (Python)</option>
                    <option value="neuron_types_data.json">Neuron Types (Python)</option>
                    <option value="base_shapes.json">Base Shapes (No GP)</option>
                </optgroup>
                <optgroup label="MATLAB">
                    <option value="matlab_neuron_data.json">Single Neuron (MATLAB)</option>
                    <option value="matlab_neurons_data.json">Multiple Neurons (MATLAB)</option>
                    <option value="matlab_neuron_types_data.json">Neuron Types (MATLAB)</option>
                </optgroup>
            </select>
            <button id="loadBtn">Load</button>
        </div>

        <div class="control-group">
            <label>Or upload JSON file</label>
            <input type="file" id="fileInput" accept=".json">
        </div>

        <div class="control-group">
            <label class="checkbox-group">
                <input type="checkbox" id="showSoma" checked>
                Show Soma
            </label>
        </div>

        <div class="control-group">
            <label class="checkbox-group">
                <input type="checkbox" id="showNucleus" checked>
                Show Nucleus
            </label>
        </div>

        <div class="control-group">
            <label class="checkbox-group">
                <input type="checkbox" id="wireframe">
                Wireframe Mode
            </label>
        </div>

        <div class="control-group">
            <label>Soma Opacity: <span id="somaOpacityVal">0.6</span></label>
            <input type="range" id="somaOpacity" min="0.1" max="1" step="0.1" value="0.6">
        </div>

        <div class="control-group">
            <label>Nucleus Opacity: <span id="nucOpacityVal">0.9</span></label>
            <input type="range" id="nucOpacity" min="0.1" max="1" step="0.1" value="0.9">
        </div>

        <div class="control-group">
            <button id="resetCamera">Reset Camera</button>
        </div>
    </div>

    <div id="info">
        <strong>Controls:</strong><br>
        Left click + drag: Rotate<br>
        Right click + drag: Pan<br>
        Scroll: Zoom
    </div>

    <div id="loading">Loading Three.js...</div>
    <div id="tooltip"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Hide loading message
        document.getElementById('loading').classList.add('hidden');

        // Scene setup
        const container = document.getElementById('container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        const camera = new THREE.PerspectiveCamera(
            60,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(30, 30, 30);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(50, 50, 50);
        scene.add(directionalLight);

        const directionalLight2 = new THREE.DirectionalLight(0xffffff, 0.5);
        directionalLight2.position.set(-50, -50, -50);
        scene.add(directionalLight2);

        // Grid helper
        const gridHelper = new THREE.GridHelper(100, 20, 0x444444, 0x333333);
        scene.add(gridHelper);

        // Axes helper
        const axesHelper = new THREE.AxesHelper(10);
        scene.add(axesHelper);

        // Store meshes and neuron data
        let somaMeshes = [];
        let nucleusMeshes = [];
        let neuronData = [];  // Store neuron metadata for hover info

        // Raycaster for hover detection
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const tooltip = document.getElementById('tooltip');

        // Neuron type descriptions
        const typeDescriptions = {
            'pyramidal': 'Teardrop-shaped neurons found in cortex and hippocampus',
            'pyr': 'Teardrop-shaped neurons found in cortex and hippocampus',
            'spherical': 'Spherical neurons (granule cells, MSNs)',
            'stellate': 'Highly spherical neurons in cortex layer IV',
            'fusiform': 'Elongated spindle-shaped neurons (layer VI, von Economo)'
        };

        // Colors
        const somaColors = [
            0x4ecdc4, 0xff6b6b, 0x45b7d1, 0x96ceb4,
            0xffeaa7, 0xdfe6e9, 0x74b9ff, 0xa29bfe,
            0xfd79a8
        ];
        const nucleusColor = 0x2d3436;

        function clearScene() {
            somaMeshes.forEach(mesh => scene.remove(mesh));
            nucleusMeshes.forEach(mesh => scene.remove(mesh));
            somaMeshes = [];
            nucleusMeshes = [];
            neuronData = [];
        }

        function createMeshFromData(vertices, faces, color, opacity) {
            const geometry = new THREE.BufferGeometry();

            // Flatten vertices
            const positions = new Float32Array(vertices.flat());
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            // Create indices from faces
            const indices = new Uint32Array(faces.flat());
            geometry.setIndex(new THREE.BufferAttribute(indices, 1));

            geometry.computeVertexNormals();

            const material = new THREE.MeshPhongMaterial({
                color: color,
                transparent: true,
                opacity: opacity,
                side: THREE.DoubleSide,
                wireframe: document.getElementById('wireframe').checked,
            });

            return new THREE.Mesh(geometry, material);
        }

        function loadNeuronData(data) {
            clearScene();

            const neurons = data.neurons;
            console.log(`Loading ${neurons.length} neurons`);

            neurons.forEach((neuron, i) => {
                // Store neuron metadata
                neuronData.push({
                    name: neuron.name || `Neuron ${i + 1}`,
                    type: neuron.type || 'unknown',
                    index: i
                });

                // Soma
                const somaColor = somaColors[i % somaColors.length];
                const somaOpacity = parseFloat(document.getElementById('somaOpacity').value);
                const somaMesh = createMeshFromData(
                    neuron.soma.vertices,
                    neuron.soma.faces,
                    somaColor,
                    somaOpacity
                );
                somaMesh.visible = document.getElementById('showSoma').checked;
                somaMesh.userData.neuronIndex = i;  // Store index for raycasting
                scene.add(somaMesh);
                somaMeshes.push(somaMesh);

                // Nucleus
                const nucOpacity = parseFloat(document.getElementById('nucOpacity').value);
                const nucleusMesh = createMeshFromData(
                    neuron.nucleus.vertices,
                    neuron.nucleus.faces,
                    nucleusColor,
                    nucOpacity
                );
                nucleusMesh.visible = document.getElementById('showNucleus').checked;
                nucleusMesh.userData.neuronIndex = i;  // Store index for raycasting
                scene.add(nucleusMesh);
                nucleusMeshes.push(nucleusMesh);
            });

            // Fit camera
            fitCameraToScene();
        }

        function fitCameraToScene() {
            const box = new THREE.Box3();
            somaMeshes.forEach(mesh => box.expandByObject(mesh));

            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);

            camera.position.set(
                center.x + maxDim,
                center.y + maxDim,
                center.z + maxDim
            );
            controls.target.copy(center);
            controls.update();
        }

        // Event handlers
        document.getElementById('loadBtn').addEventListener('click', async () => {
            const filename = document.getElementById('dataSelect').value;
            try {
                const response = await fetch(filename);
                if (!response.ok) throw new Error(`Failed to load ${filename}`);
                const data = await response.json();
                loadNeuronData(data);
            } catch (error) {
                console.error(error);
                alert(`Error: ${error.message}\n\nMake sure to run export_mesh.py first to generate the data files.`);
            }
        });

        document.getElementById('fileInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const text = await file.text();
            const data = JSON.parse(text);
            loadNeuronData(data);
        });

        document.getElementById('showSoma').addEventListener('change', (e) => {
            somaMeshes.forEach(mesh => mesh.visible = e.target.checked);
        });

        document.getElementById('showNucleus').addEventListener('change', (e) => {
            nucleusMeshes.forEach(mesh => mesh.visible = e.target.checked);
        });

        document.getElementById('wireframe').addEventListener('change', (e) => {
            [...somaMeshes, ...nucleusMeshes].forEach(mesh => {
                mesh.material.wireframe = e.target.checked;
            });
        });

        document.getElementById('somaOpacity').addEventListener('input', (e) => {
            document.getElementById('somaOpacityVal').textContent = e.target.value;
            somaMeshes.forEach(mesh => mesh.material.opacity = parseFloat(e.target.value));
        });

        document.getElementById('nucOpacity').addEventListener('input', (e) => {
            document.getElementById('nucOpacityVal').textContent = e.target.value;
            nucleusMeshes.forEach(mesh => mesh.material.opacity = parseFloat(e.target.value));
        });

        document.getElementById('resetCamera').addEventListener('click', fitCameraToScene);

        // Mouse move for hover detection
        let hoveredMesh = null;
        let originalColor = null;

        container.addEventListener('mousemove', (event) => {
            // Calculate mouse position in normalized device coordinates
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            // Update the raycaster
            raycaster.setFromCamera(mouse, camera);

            // Check intersections with soma meshes
            const intersects = raycaster.intersectObjects(somaMeshes);

            if (intersects.length > 0) {
                const intersectedMesh = intersects[0].object;
                const neuronIndex = intersectedMesh.userData.neuronIndex;
                const info = neuronData[neuronIndex];

                // Highlight the mesh
                if (hoveredMesh !== intersectedMesh) {
                    // Reset previous
                    if (hoveredMesh && originalColor !== null) {
                        hoveredMesh.material.emissive.setHex(0x000000);
                    }
                    // Highlight new
                    hoveredMesh = intersectedMesh;
                    originalColor = intersectedMesh.material.color.getHex();
                    intersectedMesh.material.emissive.setHex(0x333333);
                }

                // Show tooltip
                const typeName = info.name || info.type || 'Unknown';
                const typeDesc = typeDescriptions[info.type] || '';

                tooltip.innerHTML = `
                    <div class="type-name">${typeName}</div>
                    ${typeDesc ? `<div class="type-info">${typeDesc}</div>` : ''}
                `;
                tooltip.style.display = 'block';
                tooltip.style.left = (event.clientX + 15) + 'px';
                tooltip.style.top = (event.clientY + 15) + 'px';
            } else {
                // Reset highlight
                if (hoveredMesh && originalColor !== null) {
                    hoveredMesh.material.emissive.setHex(0x000000);
                    hoveredMesh = null;
                    originalColor = null;
                }
                // Hide tooltip
                tooltip.style.display = 'none';
            }
        });

        // Hide tooltip when mouse leaves container
        container.addEventListener('mouseleave', () => {
            if (hoveredMesh && originalColor !== null) {
                hoveredMesh.material.emissive.setHex(0x000000);
                hoveredMesh = null;
                originalColor = null;
            }
            tooltip.style.display = 'none';
        });

        // Window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Try to load default data
        fetch('neuron_data.json')
            .then(r => r.json())
            .then(data => loadNeuronData(data))
            .catch(() => console.log('No default data, use controls to load'));
    </script>
</body>
</html>
