<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dendrite Growth Comparison - MATLAB vs Python</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            overflow: hidden;
        }
        #container { width: 100vw; height: 100vh; }

        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.85);
            padding: 20px;
            border-radius: 10px;
            min-width: 300px;
            max-height: 90vh;
            overflow-y: auto;
            z-index: 10;
        }
        h1 { font-size: 1.3rem; margin-bottom: 8px; color: #4ecdc4; }
        .subtitle { font-size: 0.8rem; color: #888; margin-bottom: 15px; }
        h2 {
            font-size: 0.95rem;
            margin: 14px 0 8px;
            color: #74b9ff;
            border-bottom: 1px solid #333;
            padding-bottom: 4px;
        }
        .control-group { margin-bottom: 10px; }
        label { display: block; margin-bottom: 4px; font-size: 0.82rem; color: #aaa; }
        select, button, input[type="file"] {
            width: 100%;
            padding: 7px 10px;
            border: none;
            border-radius: 5px;
            background: #2d2d44;
            color: #fff;
            font-size: 0.85rem;
            cursor: pointer;
        }
        button { background: #4ecdc4; color: #1a1a2e; font-weight: bold; margin-top: 4px; }
        button:hover { background: #45b7aa; }
        button.secondary { background: #555; color: #eee; }
        button.secondary:hover { background: #666; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
        .checkbox-group input { width: auto; }
        input[type="range"] { width: 100%; margin-top: 4px; }
        .color-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .side-label {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-right: 4px;
        }
        .matlab-label { background: #e74c3c; color: #fff; }
        .python-label { background: #3498db; color: #fff; }

        #stats {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 10px;
            font-size: 0.82rem;
            color: #aaa;
            min-width: 240px;
            z-index: 10;
        }
        #stats h3 { color: #4ecdc4; margin-bottom: 8px; font-size: 1rem; }
        .stat-section { margin-bottom: 12px; }
        .stat-section h4 { font-size: 0.85rem; margin-bottom: 4px; }
        .stat-section h4.matlab { color: #e74c3c; }
        .stat-section h4.python { color: #3498db; }
        .stat { margin: 3px 0; }
        .stat-label { color: #888; }
        .stat-value { color: #fff; float: right; }

        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px;
            border-radius: 10px;
            font-size: 0.8rem;
            color: #aaa;
            z-index: 10;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
            color: #4ecdc4;
            z-index: 20;
        }
        .hidden { display: none !important; }

        .neuron-row { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
        .neuron-toggle { cursor: pointer; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div id="container"></div>

    <div id="controls">
        <h1>Dendrite Viewer</h1>
        <div class="subtitle">MATLAB vs Python Comparison</div>

        <h2>Data</h2>
        <div class="control-group">
            <label><span class="side-label matlab-label">MATLAB</span> JSON</label>
            <input type="file" id="matlabFile" accept=".json">
        </div>
        <div class="control-group">
            <label><span class="side-label python-label">Python</span> JSON</label>
            <input type="file" id="pythonFile" accept=".json">
        </div>
        <div class="control-group">
            <button id="loadDefaultBtn">Load Default Files</button>
        </div>

        <h2>View Mode</h2>
        <div class="control-group">
            <select id="viewMode">
                <option value="side_by_side">Side by Side</option>
                <option value="overlay">Overlay</option>
                <option value="matlab_only">MATLAB Only</option>
                <option value="python_only">Python Only</option>
            </select>
        </div>

        <h2>Visibility</h2>
        <div class="control-group">
            <label class="checkbox-group">
                <input type="checkbox" id="showSoma" checked>
                Show Soma
            </label>
            <label class="checkbox-group">
                <input type="checkbox" id="showDendrites" checked>
                Show Dendrites
            </label>
            <label class="checkbox-group">
                <input type="checkbox" id="showNucleus">
                Show Nucleus
            </label>
            <label class="checkbox-group">
                <input type="checkbox" id="showBounds" checked>
                Show Volume Bounds
            </label>
        </div>

        <h2>Appearance</h2>
        <div class="control-group">
            <label>Voxel Size: <span id="voxelSizeVal">0.8</span></label>
            <input type="range" id="voxelSize" min="0.3" max="2.0" step="0.1" value="0.8">
        </div>
        <div class="control-group">
            <label>Soma Opacity: <span id="somaOpacityVal">0.5</span></label>
            <input type="range" id="somaOpacity" min="0.1" max="1.0" step="0.1" value="0.5">
        </div>
        <div class="control-group">
            <label>Dendrite Opacity: <span id="dendOpacityVal">0.8</span></label>
            <input type="range" id="dendOpacity" min="0.1" max="1.0" step="0.1" value="0.8">
        </div>

        <h2>Neurons</h2>
        <div id="neuronToggles"></div>

        <div class="control-group" style="margin-top: 15px;">
            <button id="resetCamera" class="secondary">Reset Camera</button>
        </div>
    </div>

    <div id="stats" class="hidden">
        <h3>Comparison Stats</h3>
        <div class="stat-section">
            <h4 class="matlab">MATLAB</h4>
            <div class="stat"><span class="stat-label">Soma:</span> <span class="stat-value" id="mSoma">-</span></div>
            <div class="stat"><span class="stat-label">Dendrites:</span> <span class="stat-value" id="mDend">-</span></div>
            <div class="stat"><span class="stat-label">Total:</span> <span class="stat-value" id="mTotal">-</span></div>
        </div>
        <div class="stat-section">
            <h4 class="python">Python</h4>
            <div class="stat"><span class="stat-label">Soma:</span> <span class="stat-value" id="pSoma">-</span></div>
            <div class="stat"><span class="stat-label">Dendrites:</span> <span class="stat-value" id="pDend">-</span></div>
            <div class="stat"><span class="stat-label">Total:</span> <span class="stat-value" id="pTotal">-</span></div>
        </div>
        <div class="stat-section">
            <h4 style="color: #4ecdc4;">Grid</h4>
            <div class="stat"><span class="stat-label">Shape:</span> <span class="stat-value" id="gridShape">-</span></div>
            <div class="stat"><span class="stat-label">Neurons:</span> <span class="stat-value" id="nNeurons">-</span></div>
        </div>
    </div>

    <div id="info">
        <strong>Controls:</strong> Left drag: Rotate | Right drag: Pan | Scroll: Zoom
    </div>

    <div id="loading">Loading Three.js...</div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        document.getElementById('loading').classList.add('hidden');

        // ─── Scene Setup ────────────────────────────────────────
        const container = document.getElementById('container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        const camera = new THREE.PerspectiveCamera(
            60, window.innerWidth / window.innerHeight, 0.1, 3000
        );
        camera.position.set(150, 120, 150);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Lighting
        scene.add(new THREE.AmbientLight(0x606060, 0.8));
        const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight1.position.set(150, 200, 150);
        scene.add(dirLight1);
        const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.3);
        dirLight2.position.set(-100, -50, -100);
        scene.add(dirLight2);

        // Grid
        const gridHelper = new THREE.GridHelper(200, 20, 0x444444, 0x333333);
        scene.add(gridHelper);
        const axesHelper = new THREE.AxesHelper(20);
        scene.add(axesHelper);

        // ─── State ──────────────────────────────────────────────
        let matlabData = null;
        let pythonData = null;
        let matlabMeshes = { soma: [], dendrites: [], nucleus: [], bounds: null };
        let pythonMeshes = { soma: [], dendrites: [], nucleus: [], bounds: null };
        let neuronVisible = [];  // per-neuron toggle

        const neuronColors = [
            0x4ecdc4, 0xff6b6b, 0x45b7d1, 0x96ceb4,
            0xffeaa7, 0xdfe6e9, 0x74b9ff, 0xa29bfe,
            0xfd79a8, 0x00b894, 0xe17055, 0x6c5ce7,
        ];

        // ─── InstancedMesh helpers ──────────────────────────────
        function createVoxelCloud(positions, color, size, opacity, offsetX = 0) {
            // positions: flat array [x1,y1,z1, x2,y2,z2, ...]
            const count = positions.length / 3;
            if (count === 0) return null;

            const geometry = new THREE.BoxGeometry(size, size, size);
            const material = new THREE.MeshPhongMaterial({
                color: color,
                transparent: opacity < 1.0,
                opacity: opacity,
            });

            const mesh = new THREE.InstancedMesh(geometry, material, count);
            const dummy = new THREE.Object3D();

            for (let i = 0; i < count; i++) {
                const x = positions[i * 3];
                const z = positions[i * 3 + 1]; // swap Y/Z for Three.js
                const y = positions[i * 3 + 2];
                dummy.position.set(x + offsetX, y, z);
                dummy.updateMatrix();
                mesh.setMatrixAt(i, dummy.matrix);
            }
            mesh.instanceMatrix.needsUpdate = true;
            return mesh;
        }

        function clearMeshGroup(group) {
            ['soma', 'dendrites', 'nucleus'].forEach(key => {
                group[key].forEach(m => { scene.remove(m); m.geometry.dispose(); });
                group[key] = [];
            });
            if (group.bounds) {
                scene.remove(group.bounds);
                group.bounds = null;
            }
        }

        // ─── Build scene from data ─────────────────────────────
        function buildMeshes(data, meshGroup, offsetX) {
            clearMeshGroup(meshGroup);

            const voxelSize = parseFloat(document.getElementById('voxelSize').value);
            const somaOpacity = parseFloat(document.getElementById('somaOpacity').value);
            const dendOpacity = parseFloat(document.getElementById('dendOpacity').value);
            const showSoma = document.getElementById('showSoma').checked;
            const showDend = document.getElementById('showDendrites').checked;
            const showNuc = document.getElementById('showNucleus').checked;
            const showBounds = document.getElementById('showBounds').checked;

            if (!data || !data.neurons) return;

            data.neurons.forEach((neuron, i) => {
                const color = neuronColors[i % neuronColors.length];
                const visible = neuronVisible[i] !== false;

                // Soma
                if (neuron.soma_positions && neuron.soma_positions.length > 0) {
                    const mesh = createVoxelCloud(
                        neuron.soma_positions, color, voxelSize, somaOpacity, offsetX
                    );
                    if (mesh) {
                        mesh.visible = showSoma && visible;
                        mesh.userData = { type: 'soma', neuronIdx: i };
                        scene.add(mesh);
                        meshGroup.soma.push(mesh);
                    }
                }

                // Dendrites
                if (neuron.dendrite_positions && neuron.dendrite_positions.length > 0) {
                    const mesh = createVoxelCloud(
                        neuron.dendrite_positions, color, voxelSize * 0.7, dendOpacity, offsetX
                    );
                    if (mesh) {
                        mesh.visible = showDend && visible;
                        mesh.userData = { type: 'dendrite', neuronIdx: i };
                        scene.add(mesh);
                        meshGroup.dendrites.push(mesh);
                    }
                }

                // Nucleus
                if (neuron.nucleus_positions && neuron.nucleus_positions.length > 0) {
                    const mesh = createVoxelCloud(
                        neuron.nucleus_positions, 0x2d3436, voxelSize * 0.9, 0.9, offsetX
                    );
                    if (mesh) {
                        mesh.visible = showNuc && visible;
                        mesh.userData = { type: 'nucleus', neuronIdx: i };
                        scene.add(mesh);
                        meshGroup.nucleus.push(mesh);
                    }
                }
            });

            // Volume bounding box
            if (data.grid_shape) {
                const gs = data.grid_shape;
                const boxGeom = new THREE.BoxGeometry(gs[0], gs[2], gs[1]);
                const borderColor = data.source === 'matlab' ? 0xe74c3c : 0x3498db;
                const boxMat = new THREE.MeshBasicMaterial({
                    color: borderColor,
                    wireframe: true,
                    transparent: true,
                    opacity: 0.25,
                });
                const box = new THREE.Mesh(boxGeom, boxMat);
                box.position.set(gs[0] / 2 + offsetX, gs[2] / 2, gs[1] / 2);
                box.visible = showBounds;
                scene.add(box);
                meshGroup.bounds = box;
            }
        }

        function getOffsets() {
            const mode = document.getElementById('viewMode').value;
            const gs = (matlabData || pythonData)?.grid_shape || [120, 120, 60];
            if (mode === 'side_by_side') {
                return { matlab: -(gs[0] / 2 + 10), python: gs[0] / 2 + 10 };
            }
            return { matlab: 0, python: 0 };
        }

        function rebuildAll() {
            const offsets = getOffsets();
            const mode = document.getElementById('viewMode').value;

            if (matlabData && mode !== 'python_only') {
                buildMeshes(matlabData, matlabMeshes, offsets.matlab);
            } else {
                clearMeshGroup(matlabMeshes);
            }

            if (pythonData && mode !== 'matlab_only') {
                buildMeshes(pythonData, pythonMeshes, offsets.python);
            } else {
                clearMeshGroup(pythonMeshes);
            }

            updateStats();
        }

        // ─── Visibility updates (no rebuild) ───────────────────
        function updateVisibility() {
            const showSoma = document.getElementById('showSoma').checked;
            const showDend = document.getElementById('showDendrites').checked;
            const showNuc = document.getElementById('showNucleus').checked;
            const showBounds = document.getElementById('showBounds').checked;

            [matlabMeshes, pythonMeshes].forEach(group => {
                group.soma.forEach(m => {
                    const vis = neuronVisible[m.userData.neuronIdx] !== false;
                    m.visible = showSoma && vis;
                });
                group.dendrites.forEach(m => {
                    const vis = neuronVisible[m.userData.neuronIdx] !== false;
                    m.visible = showDend && vis;
                });
                group.nucleus.forEach(m => {
                    const vis = neuronVisible[m.userData.neuronIdx] !== false;
                    m.visible = showNuc && vis;
                });
                if (group.bounds) group.bounds.visible = showBounds;
            });
        }

        // ─── Stats panel ────────────────────────────────────────
        function updateStats() {
            const panel = document.getElementById('stats');
            panel.classList.remove('hidden');

            if (matlabData?.stats) {
                document.getElementById('mSoma').textContent = matlabData.stats.total_soma?.toLocaleString() || '-';
                document.getElementById('mDend').textContent = matlabData.stats.total_dendrites?.toLocaleString() || '-';
                document.getElementById('mTotal').textContent = matlabData.stats.total_after?.toLocaleString() || '-';
            }
            if (pythonData?.stats) {
                document.getElementById('pSoma').textContent = pythonData.stats.total_soma?.toLocaleString() || '-';
                document.getElementById('pDend').textContent = pythonData.stats.total_dendrites?.toLocaleString() || '-';
                document.getElementById('pTotal').textContent = pythonData.stats.total_after?.toLocaleString() || '-';
            }

            const data = matlabData || pythonData;
            if (data) {
                document.getElementById('gridShape').textContent =
                    data.grid_shape ? data.grid_shape.join(' x ') : '-';
                document.getElementById('nNeurons').textContent =
                    data.neurons?.length || '-';
            }
        }

        // ─── Neuron toggles ─────────────────────────────────────
        function buildNeuronToggles() {
            const container = document.getElementById('neuronToggles');
            container.innerHTML = '';
            const data = matlabData || pythonData;
            if (!data || !data.neurons) return;

            data.neurons.forEach((neuron, i) => {
                if (neuronVisible[i] === undefined) neuronVisible[i] = true;

                const row = document.createElement('div');
                row.className = 'neuron-row';

                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.checked = neuronVisible[i];
                cb.addEventListener('change', () => {
                    neuronVisible[i] = cb.checked;
                    updateVisibility();
                });

                const colorHex = '#' + neuronColors[i % neuronColors.length].toString(16).padStart(6, '0');
                const dot = document.createElement('span');
                dot.className = 'color-dot';
                dot.style.background = colorHex;

                const label = document.createElement('span');
                label.className = 'neuron-toggle';
                const dendCount = neuron.dendrite_count || 0;
                label.textContent = `Neuron ${neuron.id} (${dendCount} dend)`;

                row.appendChild(cb);
                row.appendChild(dot);
                row.appendChild(label);
                container.appendChild(row);
            });
        }

        // ─── Camera ─────────────────────────────────────────────
        function fitCamera() {
            const box = new THREE.Box3();
            const allMeshes = [
                ...matlabMeshes.soma, ...matlabMeshes.dendrites,
                ...pythonMeshes.soma, ...pythonMeshes.dendrites,
            ];
            allMeshes.forEach(m => {
                if (m.visible) box.expandByObject(m);
            });

            if (box.isEmpty()) {
                camera.position.set(150, 100, 150);
                controls.target.set(0, 30, 60);
            } else {
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                camera.position.set(
                    center.x + maxDim * 0.9,
                    center.y + maxDim * 0.7,
                    center.z + maxDim * 0.9
                );
                controls.target.copy(center);
            }
            controls.update();
        }

        // ─── Data loading ───────────────────────────────────────
        async function loadJSON(path) {
            const resp = await fetch(path);
            if (!resp.ok) throw new Error(`Failed to load ${path}: ${resp.status}`);
            return resp.json();
        }

        function loadFileAsJSON(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    try { resolve(JSON.parse(reader.result)); }
                    catch (e) { reject(e); }
                };
                reader.onerror = reject;
                reader.readAsText(file);
            });
        }

        document.getElementById('loadDefaultBtn').addEventListener('click', async () => {
            try {
                document.getElementById('loading').classList.remove('hidden');
                const [m, p] = await Promise.all([
                    loadJSON('matlab_dendrites.json').catch(() => null),
                    loadJSON('python_dendrites.json').catch(() => null),
                ]);
                if (m) matlabData = m;
                if (p) pythonData = p;
                if (!m && !p) {
                    alert('No default data files found. Please upload JSON files.');
                    document.getElementById('loading').classList.add('hidden');
                    return;
                }
                buildNeuronToggles();
                rebuildAll();
                fitCamera();
                document.getElementById('loading').classList.add('hidden');
            } catch (err) {
                console.error(err);
                alert('Error loading data: ' + err.message);
                document.getElementById('loading').classList.add('hidden');
            }
        });

        document.getElementById('matlabFile').addEventListener('change', async (e) => {
            if (e.target.files[0]) {
                matlabData = await loadFileAsJSON(e.target.files[0]);
                buildNeuronToggles();
                rebuildAll();
                fitCamera();
            }
        });

        document.getElementById('pythonFile').addEventListener('change', async (e) => {
            if (e.target.files[0]) {
                pythonData = await loadFileAsJSON(e.target.files[0]);
                buildNeuronToggles();
                rebuildAll();
                fitCamera();
            }
        });

        // ─── UI Controls ────────────────────────────────────────
        document.getElementById('viewMode').addEventListener('change', () => {
            rebuildAll();
            fitCamera();
        });

        ['showSoma', 'showDendrites', 'showNucleus', 'showBounds'].forEach(id => {
            document.getElementById(id).addEventListener('change', updateVisibility);
        });

        document.getElementById('voxelSize').addEventListener('input', (e) => {
            document.getElementById('voxelSizeVal').textContent = e.target.value;
            rebuildAll();
        });
        document.getElementById('somaOpacity').addEventListener('input', (e) => {
            document.getElementById('somaOpacityVal').textContent = e.target.value;
            // Update material opacity without full rebuild
            [matlabMeshes, pythonMeshes].forEach(g => {
                g.soma.forEach(m => { m.material.opacity = parseFloat(e.target.value); });
            });
        });
        document.getElementById('dendOpacity').addEventListener('input', (e) => {
            document.getElementById('dendOpacityVal').textContent = e.target.value;
            [matlabMeshes, pythonMeshes].forEach(g => {
                g.dendrites.forEach(m => { m.material.opacity = parseFloat(e.target.value); });
            });
        });

        document.getElementById('resetCamera').addEventListener('click', fitCamera);

        // ─── Side-by-side labels ────────────────────────────────
        function addLabel(text, color, x, y, z) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = color;
            ctx.font = 'bold 32px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(text, 128, 44);

            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.SpriteMaterial({ map: texture, transparent: true });
            const sprite = new THREE.Sprite(material);
            sprite.position.set(x, y, z);
            sprite.scale.set(40, 10, 1);
            return sprite;
        }

        let matlabLabel = null, pythonLabel = null;

        function updateLabels() {
            if (matlabLabel) { scene.remove(matlabLabel); matlabLabel = null; }
            if (pythonLabel) { scene.remove(pythonLabel); pythonLabel = null; }

            const mode = document.getElementById('viewMode').value;
            if (mode !== 'side_by_side') return;

            const gs = (matlabData || pythonData)?.grid_shape || [120, 120, 60];
            const offsets = getOffsets();

            if (matlabData) {
                matlabLabel = addLabel('MATLAB', '#e74c3c', offsets.matlab + gs[0]/2, gs[2] + 10, gs[1]/2);
                scene.add(matlabLabel);
            }
            if (pythonData) {
                pythonLabel = addLabel('Python', '#3498db', offsets.python + gs[0]/2, gs[2] + 10, gs[1]/2);
                scene.add(pythonLabel);
            }
        }

        // Patch rebuildAll to update labels
        const _origRebuild = rebuildAll;
        rebuildAll = function() {
            _origRebuild();
            updateLabels();
        };

        // ─── Resize ─────────────────────────────────────────────
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ─── Animate ────────────────────────────────────────────
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
