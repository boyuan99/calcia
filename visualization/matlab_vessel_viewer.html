<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATLAB Vessel Volume Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            overflow: hidden;
        }
        #container {
            width: 100vw;
            height: 100vh;
        }
        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            min-width: 280px;
        }
        h1 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: #ff6b6b;
        }
        .control-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.85rem;
            color: #aaa;
        }
        button {
            width: 100%;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            background: #ff6b6b;
            color: #1a1a2e;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }
        button:hover {
            background: #ff5252;
        }
        button.secondary {
            background: #2d2d44;
            color: #fff;
        }
        button.secondary:hover {
            background: #3d3d54;
        }
        input[type="range"] {
            width: 100%;
            margin-top: 5px;
        }
        #stats {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 10px;
            font-size: 0.85rem;
            min-width: 200px;
        }
        #stats h3 {
            color: #ff6b6b;
            margin-bottom: 10px;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .stat-value {
            color: #fff;
            font-weight: bold;
        }
        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            font-size: 0.85rem;
            color: #aaa;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
            color: #ff6b6b;
            text-align: center;
        }
        .hidden {
            display: none !important;
        }
        .section-title {
            color: #ff6b6b;
            font-size: 0.9rem;
            margin-top: 15px;
            margin-bottom: 10px;
            padding-top: 10px;
            border-top: 1px solid #444;
        }
    </style>
</head>
<body>
    <div id="container"></div>

    <div id="controls">
        <h1>MATLAB Vessel Viewer</h1>

        <div class="control-group">
            <button id="loadMatlabBtn">Load MATLAB Vessels</button>
        </div>

        <div class="control-group">
            <button id="loadPythonBtn" class="secondary">Load Python Volume</button>
        </div>

        <div class="control-group">
            <button id="loadBothBtn" class="secondary">Compare Both</button>
        </div>

        <div class="section-title">Display Options</div>

        <div class="control-group">
            <label>Point Size: <span id="pointSizeVal">1.0</span></label>
            <input type="range" id="pointSize" min="0.5" max="5" step="0.5" value="1.0">
        </div>

        <div class="control-group">
            <label>Opacity: <span id="opacityVal">0.8</span></label>
            <input type="range" id="opacity" min="0.1" max="1" step="0.1" value="0.8">
        </div>

        <div class="control-group">
            <label>Z Slice Min: <span id="zMinVal">0</span></label>
            <input type="range" id="zMin" min="0" max="400" step="10" value="0">
        </div>

        <div class="control-group">
            <label>Z Slice Max: <span id="zMaxVal">400</span></label>
            <input type="range" id="zMax" min="0" max="400" step="10" value="400">
        </div>

        <div class="control-group">
            <button id="resetCamera">Reset Camera</button>
        </div>
    </div>

    <div id="stats">
        <h3>Volume Stats</h3>
        <div class="stat-row">
            <span>Source:</span>
            <span class="stat-value" id="statSource">-</span>
        </div>
        <div class="stat-row">
            <span>Original Shape:</span>
            <span class="stat-value" id="statShape">-</span>
        </div>
        <div class="stat-row">
            <span>Total Voxels:</span>
            <span class="stat-value" id="statVoxels">-</span>
        </div>
        <div class="stat-row">
            <span>Displayed:</span>
            <span class="stat-value" id="statDisplayed">-</span>
        </div>
    </div>

    <div id="info">
        <strong>Controls:</strong><br>
        Left click + drag: Rotate<br>
        Right click + drag: Pan<br>
        Scroll: Zoom
    </div>

    <div id="loading">Loading Three.js...</div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        document.getElementById('loading').classList.add('hidden');

        // Scene setup
        const container = document.getElementById('container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        const camera = new THREE.PerspectiveCamera(
            60, window.innerWidth / window.innerHeight, 0.1, 5000
        );
        camera.position.set(300, 300, 300);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Lighting
        scene.add(new THREE.AmbientLight(0x404040, 0.5));
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(100, 100, 100);
        scene.add(light);

        // Grid and axes
        const gridHelper = new THREE.GridHelper(500, 50, 0x444444, 0x333333);
        scene.add(gridHelper);
        scene.add(new THREE.AxesHelper(50));

        // State
        let pointCloud = null;
        let allVoxels = [];
        let currentData = null;

        function clearScene() {
            if (pointCloud) {
                scene.remove(pointCloud);
                pointCloud.geometry.dispose();
                pointCloud.material.dispose();
                pointCloud = null;
            }
        }

        function createPointCloud(voxels, color = 0xff0000, coordOrder = 'XYZ') {
            const positions = new Float32Array(voxels.length * 3);

            for (let i = 0; i < voxels.length; i++) {
                let x, y, z;

                if (coordOrder === 'ZYX') {
                    // MATLAB volume: argwhere returns (Z, Y, X)
                    z = voxels[i][0];
                    y = voxels[i][1];
                    x = voxels[i][2];
                } else {
                    // Python volume: argwhere returns (X, Y, Z)
                    x = voxels[i][0];
                    y = voxels[i][1];
                    z = voxels[i][2];
                }

                // Three.js: X=right, Y=up, Z=forward
                // We want Z (depth) to be the vertical axis (Y in Three.js)
                positions[i * 3] = x - 250;      // X -> X
                positions[i * 3 + 1] = z;        // Z (depth) -> Y (up)
                positions[i * 3 + 2] = y - 250;  // Y -> Z
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const material = new THREE.PointsMaterial({
                color: color,
                size: parseFloat(document.getElementById('pointSize').value),
                transparent: true,
                opacity: parseFloat(document.getElementById('opacity').value),
                sizeAttenuation: true
            });

            return new THREE.Points(geometry, material);
        }

        function updateDisplay() {
            if (!allVoxels.length) return;

            const zMin = parseInt(document.getElementById('zMin').value);
            const zMax = parseInt(document.getElementById('zMax').value);

            // Get coordinate order from data
            const coordOrder = currentData.coordinate_order || 'XYZ';

            // Filter voxels by Z range
            // Z is at index 0 for ZYX order, index 2 for XYZ order
            const zIndex = coordOrder === 'ZYX' ? 0 : 2;
            const filtered = allVoxels.filter(v => v[zIndex] >= zMin && v[zIndex] <= zMax);

            clearScene();

            const color = currentData.type === 'matlab_volume' ? 0xff4444 : 0x44ff44;
            pointCloud = createPointCloud(filtered, color, coordOrder);
            scene.add(pointCloud);

            document.getElementById('statDisplayed').textContent = filtered.length.toLocaleString();
        }

        function loadData(data, source) {
            currentData = data;

            if (data.type === 'matlab_volume') {
                allVoxels = data.voxels;
                document.getElementById('statSource').textContent = 'MATLAB';
                document.getElementById('statShape').textContent = data.original_shape.join(' x ');
            } else if (data.type === 'python_volume') {
                allVoxels = data.voxels;
                document.getElementById('statSource').textContent = 'Python';
                document.getElementById('statShape').textContent = data.original_shape.join(' x ');
            } else {
                // Python vessel data - extract voxel positions from connections
                allVoxels = [];
                if (data.connections) {
                    data.connections.forEach(conn => {
                        conn.points.forEach(p => {
                            allVoxels.push([
                                Math.round(p[0] * 2),  // Scale to match vres=2
                                Math.round(p[1] * 2),
                                Math.round(p[2] * 2)
                            ]);
                        });
                    });
                }
                document.getElementById('statSource').textContent = 'Python';
                document.getElementById('statShape').textContent = `${data.nodes?.length || 0} nodes`;
            }

            document.getElementById('statVoxels').textContent = allVoxels.length.toLocaleString();

            // Update Z range sliders
            if (allVoxels.length > 0) {
                const zValues = allVoxels.map(v => v[2]);
                const maxZ = Math.max(...zValues);
                document.getElementById('zMax').max = maxZ;
                document.getElementById('zMax').value = maxZ;
                document.getElementById('zMaxVal').textContent = maxZ;
            }

            updateDisplay();
            fitCamera();
        }

        function fitCamera() {
            if (!pointCloud) return;

            const box = new THREE.Box3().setFromObject(pointCloud);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);

            camera.position.set(center.x + maxDim, center.y + maxDim * 0.8, center.z + maxDim);
            controls.target.copy(center);
            controls.update();
        }

        // Event handlers
        document.getElementById('loadMatlabBtn').addEventListener('click', async () => {
            try {
                document.getElementById('loading').textContent = 'Loading MATLAB data...';
                document.getElementById('loading').classList.remove('hidden');

                const response = await fetch('matlab_vessels.json');
                if (!response.ok) throw new Error('Failed to load matlab_vessels.json');
                const data = await response.json();

                document.getElementById('loading').classList.add('hidden');
                loadData(data, 'MATLAB');
            } catch (error) {
                document.getElementById('loading').classList.add('hidden');
                alert('Error: ' + error.message);
            }
        });

        document.getElementById('loadPythonBtn').addEventListener('click', async () => {
            try {
                document.getElementById('loading').textContent = 'Loading Python data...';
                document.getElementById('loading').classList.remove('hidden');

                const response = await fetch('python_vessels.json');
                if (!response.ok) throw new Error('Failed to load python_vessels.json');
                const data = await response.json();

                document.getElementById('loading').classList.add('hidden');
                loadData(data, 'Python');
            } catch (error) {
                document.getElementById('loading').classList.add('hidden');
                alert('Error: ' + error.message);
            }
        });

        document.getElementById('loadBothBtn').addEventListener('click', async () => {
            try {
                document.getElementById('loading').textContent = 'Loading both datasets...';
                document.getElementById('loading').classList.remove('hidden');

                const [matlabRes, pythonRes] = await Promise.all([
                    fetch('matlab_vessels.json'),
                    fetch('python_vessels.json')
                ]);

                if (!matlabRes.ok || !pythonRes.ok) {
                    throw new Error('Failed to load one or both files');
                }

                const matlabData = await matlabRes.json();
                const pythonData = await pythonRes.json();

                clearScene();

                // Get coordinate orders
                const matlabOrder = matlabData.coordinate_order || 'ZYX';
                const pythonOrder = pythonData.coordinate_order || 'XYZ';

                // Create MATLAB point cloud (red)
                const matlabCloud = createPointCloud(matlabData.voxels, 0xff4444, matlabOrder);
                scene.add(matlabCloud);

                // Create Python point cloud (green) with X offset for side-by-side view
                // Need to offset in the correct dimension based on coordinate order
                const pythonVoxelsOffset = pythonData.voxels.map(v => {
                    // Python is XYZ, so X is at index 0
                    return [v[0] + 700, v[1], v[2]];
                });
                const pythonCloud = createPointCloud(pythonVoxelsOffset, 0x44ff44, pythonOrder);
                scene.add(pythonCloud);

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('statSource').textContent = 'Both';
                document.getElementById('statShape').textContent = 'Side by side';
                document.getElementById('statVoxels').textContent =
                    `M: ${matlabData.voxels.length.toLocaleString()}, P: ${pythonData.voxels.length.toLocaleString()}`;
                document.getElementById('statDisplayed').textContent =
                    (matlabData.voxels.length + pythonData.voxels.length).toLocaleString();

                // Fit camera to show both
                camera.position.set(600, 400, 600);
                controls.target.set(200, 150, 0);
                controls.update();

            } catch (error) {
                document.getElementById('loading').classList.add('hidden');
                alert('Error: ' + error.message);
            }
        });

        document.getElementById('pointSize').addEventListener('input', (e) => {
            document.getElementById('pointSizeVal').textContent = e.target.value;
            if (pointCloud) {
                pointCloud.material.size = parseFloat(e.target.value);
            }
        });

        document.getElementById('opacity').addEventListener('input', (e) => {
            document.getElementById('opacityVal').textContent = e.target.value;
            if (pointCloud) {
                pointCloud.material.opacity = parseFloat(e.target.value);
            }
        });

        document.getElementById('zMin').addEventListener('input', (e) => {
            document.getElementById('zMinVal').textContent = e.target.value;
            updateDisplay();
        });

        document.getElementById('zMax').addEventListener('input', (e) => {
            document.getElementById('zMaxVal').textContent = e.target.value;
            updateDisplay();
        });

        document.getElementById('resetCamera').addEventListener('click', fitCamera);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Auto-load MATLAB data
        fetch('matlab_vessels.json')
            .then(r => r.json())
            .then(data => loadData(data, 'MATLAB'))
            .catch(() => console.log('No MATLAB data found'));
    </script>
</body>
</html>
